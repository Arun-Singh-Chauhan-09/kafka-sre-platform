name: ci

# Runs on every pull request and on pushes to main.
# Everything here works without a GCP account. Even the Terraform policy
# gate runs: it plans offline (no credentials, no API calls) and checks the
# plan with the same OPA rules a real plan would face. The only job that
# talks to GCP (a real plan) is skipped unless the repository variable
# GCP_ENABLED is "true".

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STRIMZI_VERSION: "0.51.0"
  PROMETHEUS_OPERATOR_VERSION: "v0.88.0"

jobs:
  lint-test:
    name: App lint & tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Pytest
        run: python -m pytest -q

  build-scan:
    name: Image build & Trivy scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build --build-arg VERSION=ci-${{ github.sha }} -t kafka-sre:${{ github.sha }} app
      - name: Smoke test (both entrypoints import, runs as UID 10001)
        run: |
          docker run --rm kafka-sre:${{ github.sha }} python -c "import stream.producer, stream.consumer"
          docker run --rm kafka-sre:${{ github.sha }} id -u | grep -qx 10001
      - name: Install Trivy (pinned binary, checksum-verified)
        # Not the trivy-action: its tags were hijacked in March 2026
        # (GHSA-69fq-xp46-6x23). A pinned binary whose SHA-256 is checked
        # here fails the build if the download was ever tampered with.
        env:
          TRIVY_VERSION: "0.69.3"
          TRIVY_SHA256: "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"
        run: |
          curl -fsSLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          sudo tar xzf trivy.tgz -C /usr/local/bin trivy
          trivy --version
      - name: Trivy (fail on fixable HIGH/CRITICAL)
        run: |
          trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --format table kafka-sre:${{ github.sha }}

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: Terraform fmt / validate / plan + policy (offline)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        root: [infra/local-kind, infra/gcp/bootstrap, infra/gcp/envs/dev, infra/gcp/envs/prod]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      - name: terraform validate
        run: |
          terraform -chdir=${{ matrix.root }} init -backend=false -input=false
          terraform -chdir=${{ matrix.root }} validate
      - name: Offline plan + policy gate
        # A plan of new resources needs no real credentials: refresh is off
        # and nothing exists yet. A local backend override replaces GCS.
        # (The provider's optional "who am I" lookup fails with the dummy
        # token; it only logs that at INFO level and carries on.)
        # The plan JSON is what the OPA rules in policy/terraform.rego read.
        if: startsWith(matrix.root, 'infra/gcp/')
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: offline-plan-no-real-token
        run: |
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | sudo tar xz -C /usr/local/bin conftest
          cd ${{ matrix.root }}
          printf 'terraform {\n  backend "local" {}\n}\n' > backend_override.tf
          terraform init -input=false -reconfigure
          terraform plan -input=false -refresh=false -lock=false \
            -var project_id=ci-offline-project -out=tf.plan
          terraform show -json tf.plan > plan.json
          conftest test --policy "$GITHUB_WORKSPACE/policy" --namespace main plan.json
      - name: Checkov (report only)
        # Reported, not blocking: generic best practice the demo knowingly
        # defers (see README "Intentionally simplified"). The blocking gate is
        # the OPA policy above, which encodes the rules this platform enforces.
        if: matrix.root == 'infra/gcp/envs/dev'
        uses: bridgecrewio/checkov-action@d0dd2e9434b4428060edba72d050c135273bd677 # v12.3132.0
        with:
          directory: infra/gcp
          framework: terraform
          quiet: true
          soft_fail: true

  policy:
    name: Policy unit tests (Conftest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install conftest
        run: curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | sudo tar xz -C /usr/local/bin conftest
      - name: Rego formatting
        run: conftest fmt --check policy
      - name: Unit-test the policies themselves
        run: conftest verify --policy policy

  manifests:
    name: Kubernetes + Kafka manifests (schemas + policy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install conftest and kubeconform
        run: |
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | sudo tar xz -C /usr/local/bin conftest
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | sudo tar xz -C /usr/local/bin kubeconform
      - name: Render (kustomize)
        run: |
          kubectl kustomize kafka > rendered-kafka.yaml
          kubectl kustomize k8s > rendered-apps.yaml
      - name: Schemas for the exact CRD versions we install
        # Strimzi (Kafka, KafkaNodePool, KafkaTopic) and Prometheus Operator
        # (PodMonitor, ServiceMonitor, PrometheusRule) CRDs -> JSON schemas.
        run: |
          curl -fsSLo strimzi-crds.yaml "https://github.com/strimzi/strimzi-kafka-operator/releases/download/${STRIMZI_VERSION}/strimzi-crds-${STRIMZI_VERSION}.yaml"
          curl -fsSLo prom-crds.yaml "https://github.com/prometheus-operator/prometheus-operator/releases/download/${PROMETHEUS_OPERATOR_VERSION}/stripped-down-crds.yaml"
          python3 scripts/crd-schemas.py schemas strimzi-crds.yaml prom-crds.yaml
      - name: Schema validation (kubeconform -strict)
        run: |
          kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'schemas/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json' \
            rendered-kafka.yaml rendered-apps.yaml
      - name: Workload security policy (non-root, limits, probes, pinned tags)
        run: conftest test --policy policy --namespace k8s rendered-apps.yaml
      - name: Kafka durability policy (replication, min ISR, quorum)
        run: conftest test --policy policy --namespace kafka rendered-kafka.yaml
      - name: Dashboard JSON
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open("k8s/dashboards/kafka-sre.json"))
          for p in d["panels"]:
              refs = [t["refId"] for t in p.get("targets", [])]
              assert len(refs) == len(set(refs)), f"duplicate refId in panel {p['title']!r}"
          print(len(d["panels"]), "panels OK")
          EOF

  alert-rules:
    name: Alert rules, routing, runbooks (promtool + amtool)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Install promtool and amtool
        run: |
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v2.54.1/prometheus-2.54.1.linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin --strip-components=1 prometheus-2.54.1.linux-amd64/promtool
          curl -fsSL https://github.com/prometheus/alertmanager/releases/download/v0.27.0/alertmanager-0.27.0.linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin --strip-components=1 alertmanager-0.27.0.linux-amd64/amtool
      - name: Check rules, unit-test alerts, check routing and runbook links
        run: ./scripts/test-alerts.sh

  shellcheck:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: shellcheck -x scripts/*.sh

  gcp-plan:
    name: GCP plan & policy gate (real project)
    if: vars.GCP_ENABLED == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    needs: [lint-test, terraform, policy]
    permissions:
      contents: read
      id-token: write # Workload Identity Federation: no service account keys
    env:
      TF_ENV_DIR: infra/gcp/envs/dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - name: Install conftest
        run: curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | sudo tar xz -C /usr/local/bin conftest
      - name: Authenticate to GCP (OIDC -> read-only service account)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
      - name: Terraform plan
        run: |
          terraform -chdir=$TF_ENV_DIR init -input=false
          terraform -chdir=$TF_ENV_DIR plan -input=false -out=tf.plan
          terraform -chdir=$TF_ENV_DIR show -json tf.plan > plan.json
      - name: Policy gate
        run: conftest test --policy policy --namespace main plan.json
      - name: Plan summary
        run: |
          {
            echo "### Terraform plan (dev)"
            echo '```'
            terraform -chdir=$TF_ENV_DIR show -no-color tf.plan | tail -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
